<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mohamed – Daily plan</title>
<meta name="description" content="Mohamed: a personal phone-first daily planner with tasks, reminders and progress tracking.">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0B0D12;--card:#171B24;--card2:#1F2430;--line:rgba(242,239,232,.09);--gold:#C9A45C;--goldt:rgba(201,164,92,.12);--tx:#F2EFE8;--mut:#9BA0AC;--ok:#8FB9A0;--bad:#D98A8A;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:20px 18px}
main>*{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:600 1.9rem/1.2 ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:-.01em}
h1.big{font-size:1.35rem;line-height:1.4;font-weight:500;font-style:italic}
h2{font-size:1.15rem;font-weight:600;letter-spacing:-.01em}
h3{font-size:.9rem;margin:28px 0 10px;color:var(--mut);font-weight:500;letter-spacing:.02em}
.mut,small{color:var(--mut)}small{font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.hi{border-color:rgba(201,164,92,.45);background:linear-gradient(180deg,var(--goldt),transparent 80%),var(--card)}
.wis{border-left:2px solid var(--gold);border-radius:6px 18px 18px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:5px;background:var(--card2);border-radius:9px;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.task{display:flex;gap:14px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:16px;margin-bottom:8px;background:var(--card);transition:border-color .2s,opacity .2s}
.task.cur{border-color:rgba(201,164,92,.55)}.task.done b{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(155,160,172,.5)}.task.miss{opacity:.6}
.task>div{flex:1;min-width:0}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(242,239,232,.28);background:none;color:transparent;font-size:15px;flex:none;cursor:pointer;transition:all .2s}
.chk:active{transform:scale(.9)}
.done .chk{background:var(--gold);border-color:var(--gold);color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#10131A;border:1px solid var(--line);border-radius:12px;padding:12px;margin:5px 0 12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px var(--goldt)}
textarea{min-height:96px;resize:vertical}
label{font-size:.85rem;color:var(--mut)}
.btn{background:var(--gold);color:var(--bg);border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}.btn.dng{background:transparent;color:var(--bad);border:1px solid rgba(217,138,138,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 14px}
.chip{border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.85rem;background:none;color:var(--mut);cursor:pointer;transition:all .2s}
.chip.on{background:var(--goldt);border-color:var(--gold);color:var(--gold);font-weight:600}
.tag{font-size:.74rem;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));display:flex;background:rgba(23,27,36,.86);border:1px solid var(--line);border-radius:22px;padding:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 36px rgba(0,0,0,.5);z-index:5}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--mut);text-decoration:none;font-size:.7rem;font-weight:500;border-radius:16px;transition:color .2s,background .2s}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav a.on{color:var(--gold);background:var(--goldt)}
.chart{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:14px}
.chart div{flex:1;text-align:center;font-size:.7rem;color:var(--mut)}.chart i{display:block;background:var(--gold);opacity:.8;border-radius:6px 6px 2px 2px;min-height:3px;margin-bottom:6px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:600;margin-bottom:14px;letter-spacing:.01em}.logo img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--card2);color:var(--tx);border:1px solid rgba(201,164,92,.5);padding:10px 18px;border-radius:12px;font-weight:500;z-index:9;display:none;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.err{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:760px){main{padding:40px 18px}h1{font-size:2.2rem}}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<main id="app"></main>
<nav aria-label="Main">
<a href="#today" data-v="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Today</a>
<a href="#tasks" data-v="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</a>
<a href="#growth" data-v="growth"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Growth</a>
<a href="#remember" data-v="remember"><svg viewBox="0 0 24 24"><path d="M5 4h13v16H7a2 2 0 01-2-2zM5 18a2 2 0 012-2h11"/></svg>Remember</a>
</nav>
<script>
const $=s=>document.querySelector(s),KEY='routine.v1',ALL=[0,1,2,3,4,5,6],DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CATS={faith:'Faith',sport:'Sport',study:'Study',business:'Business',family:'Family',rest:'Rest',plan:'Planning'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),dk=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toMin=t=>{const[a,b]=t.split(':');return +a*60+ +b},nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function seed(){const T=(time,end,title,cat,days=ALL)=>({id:uid(),time,end,title,cat,days});
return{tasks:[T('05:00','05:30','Wake up + Fajr prayer','faith'),T('05:30','06:30','Sport','sport',[1,3,5]),T('06:30','07:00','Shower + Breakfast','rest'),T('07:00','07:30','Quran + Islamic reading','faith'),T('08:00','12:00','Deep study (University)','study'),T('12:00','13:00','Dhuhr + Lunch + Rest','faith'),T('13:00','18:00','Business + Personal projects','business'),T('18:00','19:00','Prayer + Dinner + Relax','faith'),T('19:00','21:00','Study / PC work / Skill development','study'),T('21:00','22:00','Family + Social life + Relax','family'),T('22:00','22:30','Prepare tomorrow + Sleep','plan')],
notes:[],done:{},fired:{},settings:{notify:false,lead:5,headline:''}}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.tasks)){v.settings=Object.assign({notify:false,lead:5,headline:''},v.settings);v.notes=v.notes||[];v.done=v.done||{};v.fired=v.fired||{};return v}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage is full. Export a backup in Me.',1)}}
let S=load(),view=(location.hash||'#today').slice(1),edit=null,hed=false,fq={day:'all',q:'',type:'all',nq:''};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const todays=(d=new Date())=>S.tasks.filter(t=>t.days.includes(d.getDay())).sort((a,b)=>a.time.localeCompare(b.time));
const doneSet=k=>S.done[k]||(S.done[k]=[]),isDone=(id,k=dk())=>(S.done[k]||[]).includes(id);
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'};
function dayPct(d){const ts=todays(d);if(!ts.length)return null;return Math.round(ts.filter(t=>isDone(t.id,dk(d))).length/ts.length*100)}
function row(t){const m=nowMin(),a=toMin(t.time),b=toMin(t.end),d=isDone(t.id),cur=a<=m&&m<b;
return`<div class="task ${d?'done':''} ${cur?'cur':''} ${!d&&b<=m?'miss':''}"><button class="chk" data-act="toggle" data-id="${t.id}" aria-label="Mark ${esc(t.title)} as ${d?'not done':'done'}" aria-pressed="${d}">✓</button><div><b>${esc(t.title)}</b><br><small>${t.time}–${t.end} · ${CATS[t.cat]}</small></div></div>`}
function vToday(){const ts=todays(),n=ts.filter(t=>isDone(t.id)).length,p=ts.length?Math.round(n/ts.length*100):0,m=nowMin();
const cur=ts.find(t=>toMin(t.time)<=m&&m<toMin(t.end)),nx=cur||ts.find(t=>toMin(t.time)>m);
const hl=(S.settings.headline||'').trim(),txt=hl||greet()+', Mohamed';
const head=hed?`<form id="hf" class="card" novalidate><label for="hx">Your headline: a lesson, a quote, anything</label><textarea id="hx" maxlength="200" placeholder="Leave empty to use the daily greeting">${esc(hl)}</textarea><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" type="submit">Save text</button><button class="btn alt" type="button" data-act="hreset">Use greeting</button><button class="btn alt" type="button" data-act="hcancel">Cancel</button></div></form>`:`<div class="row" style="align-items:flex-start"><h1 class="${txt.length>40?'big':''}">${esc(txt)}</h1><button class="btn sm alt" data-act="hedit" aria-label="Edit headline">Edit</button></div>`;
return`<div class="logo"><img src="icon-192.png" alt="">Mohamed</div>${head}<p class="mut">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="card"><div class="row"><b>${n} of ${ts.length} done</b><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>
${nx?`<div class="card hi"><small>${cur?'Happening now':'Up next'}</small><h2>${esc(nx.title)}</h2><p class="mut">${nx.time}–${nx.end}</p></div>`:'<div class="card"><b>No more tasks today.</b> <span class="mut">Rest well and prepare tomorrow.</span></div>'}
<h3>Today's plan</h3>${ts.map(row).join('')||'<p class="mut">No tasks scheduled today. Add one in Tasks.</p>'}`}
function taskForm(){const t=edit?S.tasks.find(x=>x.id===edit):null,v=t||{title:'',time:'09:00',end:'10:00',cat:'study',days:ALL};
return`<form id="tf" class="card" novalidate><h2>${t?'Edit task':'Add a task'}</h2><label for="ti">Title</label><input id="ti" maxlength="60" value="${esc(v.title)}" required>
<div class="g2"><div><label for="ts">Start</label><input id="ts" type="time" value="${v.time}" required></div><div><label for="te">End</label><input id="te" type="time" value="${v.end}" required></div></div>
<label for="tc">Category</label><select id="tc">${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${v.cat===k?'selected':''}>${l}</option>`).join('')}</select>
<label>Days</label><div class="chips" id="td">${ALL.map(d=>`<button type="button" class="chip ${v.days.includes(d)?'on':''}" data-act="day" data-d="${d}" aria-pressed="${v.days.includes(d)}">${DN[d]}</button>`).join('')}</div>
<div class="row"><button class="btn" type="submit">${t?'Save changes':'Add task'}</button>${t?'<button class="btn alt" type="button" data-act="cancel">Cancel</button>':''}</div></form>`}
function taskList(){let l=[...S.tasks].sort((a,b)=>a.time.localeCompare(b.time));
if(fq.day!=='all')l=l.filter(t=>t.days.includes(+fq.day));
if(fq.q)l=l.filter(t=>t.title.toLowerCase().includes(fq.q.toLowerCase()));
return l.map(t=>`<div class="task"><div><b>${esc(t.title)}</b><br><small>${t.time}–${t.end} · ${CATS[t.cat]} · ${t.days.length===7?'Every day':t.days.map(d=>DN[d]).join(', ')}</small></div><button class="btn sm alt" data-act="edit" data-id="${t.id}">Edit</button><button class="btn sm dng" data-act="del" data-id="${t.id}" aria-label="Delete ${esc(t.title)}">Delete</button></div>`).join('')||'<p class="mut">No tasks match. Change the filter or add a task above.</p>'}
function vTasks(){return`<h1>Fix tasks</h1><p class="mut">Add, edit or delete anything in your plan.</p>${taskForm()}<h3>Your tasks</h3><div class="g2"><input id="fq" placeholder="Search tasks" value="${esc(fq.q)}" aria-label="Search tasks"><select id="fd" aria-label="Filter by day"><option value="all">All days</option>${ALL.map(d=>`<option value="${d}" ${fq.day==d?'selected':''}>${DN[d]}</option>`).join('')}</select></div><div id="tl">${taskList()}</div>${settingsCard()}`}
function noteList(){let l=[...S.notes].reverse();if(fq.type!=='all')l=l.filter(n=>n.type===fq.type);if(fq.nq){const q=fq.nq.toLowerCase();l=l.filter(n=>(n.text+' '+(n.src||'')).toLowerCase().includes(q))}
return l.map(n=>{const t=S.tasks.find(x=>x.id===n.task);return`<div class="card"><div class="row"><span class="tag">${esc(n.type)}</span><small>${n.date}</small></div>${n.src?`<p style="margin-top:10px"><b>${esc(n.src)}</b></p>`:''}<p style="margin:8px 0 12px;white-space:pre-wrap">${esc(n.text)}</p>${t?`<small>About: ${esc(t.title)}</small><br>`:''}<button class="btn sm dng" data-act="ndel" data-id="${n.id}" style="margin-top:8px">Delete</button></div>`}).join('')||'<p class="mut" style="margin-top:14px">Nothing here yet. Write your first note above.</p>'}
function vRemember(){return`<div class="logo"><img src="icon-192.png" alt="">Mohamed</div><h1>Remember</h1><p class="mut">Mistakes to never repeat, and ideas from the books you read.</p>
<form id="nf" class="card" novalidate><label for="nt">Type</label><select id="nt"><option>Mistake</option><option>Book</option><option>Lesson</option><option>Note</option></select><label for="nb">Book or source (optional)</label><input id="nb" maxlength="80"><label for="nk">About a task (optional)</label><select id="nk"><option value="">None</option>${S.tasks.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select><label for="nx">What do you want to remember?</label><textarea id="nx" maxlength="600"></textarea><button class="btn" type="submit">Save note</button></form>
<h3>Your notes</h3><div class="g2"><input id="nq" placeholder="Search notes" value="${esc(fq.nq)}" aria-label="Search notes"><select id="ny" aria-label="Filter by type">${['all','Mistake','Book','Lesson','Note'].map(x=>`<option value="${x}" ${fq.type===x?'selected':''}>${x==='all'?'All types':x}</option>`).join('')}</select></div><div id="nl">${noteList()}</div>`}
function streak(){let s=0,d=new Date();const p=dayPct(d);if(p===null||p<70)d.setDate(d.getDate()-1);
for(let i=0;i<365;i++){const q=dayPct(d);if(q===null){d.setDate(d.getDate()-1);continue}if(q<70)break;s++;d.setDate(d.getDate()-1)}return s}
function vGrowth(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push([DN[d.getDay()],dayPct(d)||0])}
const rates=S.tasks.map(t=>{let sc=0,dn=0;for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);if(i===0&&nowMin()<toMin(t.end))continue;if(t.days.includes(d.getDay())){sc++;if(isDone(t.id,dk(d)))dn++}}return{t,sc,r:sc?Math.round(dn/sc*100):null}}).filter(x=>x.sc>=3);
rates.sort((a,b)=>a.r-b.r);const tips=[];
if(!rates.length)tips.push('Check off tasks for a few days and personal suggestions will appear here.');
else{const w=rates[0],b=rates[rates.length-1];if(w.r<60)tips.push(`You complete "${w.t.title}" only ${w.r}% of the time. Shorten it, move it, or prepare it the night before.`);
if(b.r>=80)tips.push(`"${b.t.title}" is your strongest habit at ${b.r}%. Attach a harder habit right after it.`);
const sp=rates.find(x=>x.t.cat==='sport');if(sp&&sp.r<100)tips.push(`Sport is at ${sp.r}%. Lay out your clothes before sleep.`);const lm=[...S.notes].reverse().find(n=>n.type==='Mistake');if(lm)tips.push(`A mistake you wrote down: "${lm.text.slice(0,90)}". Does today's plan avoid it?`);
}
const s=streak();
return`<h1>Growth</h1><div class="g2"><div class="card"><small>Current streak</small><h2>${s} day${s===1?'':'s'}</h2><small>Days with 70%+ done</small></div><div class="card"><small>Today</small><h2>${dayPct(new Date())||0}%</h2></div></div>
<div class="card"><b>Last 7 days</b><div class="chart">${days.map(([l,p])=>`<div><i style="height:${p}px"></i>${l}<br>${p}%</div>`).join('')}</div></div>
<h3>Suggestions for you</h3>${tips.map(x=>`<div class="card wis">${esc(x)}</div>`).join('')}
${rates.length?`<h3>Habit rates, last 14 days</h3>${rates.map(x=>`<div class="card"><div class="row"><span>${esc(x.t.title)}</span><b>${x.r}%</b></div><div class="bar"><i style="width:${x.r}%"></i></div></div>`).join('')}`:''}`}
function settingsCard(){const st=S.settings,perm='Notification'in window?Notification.permission:'unsupported';
return`<h3>Reminders and backup</h3><div class="card"><b>Reminders</b><p class="mut" style="margin:6px 0">Status: ${st.notify&&perm==='granted'?'on':perm==='denied'?'blocked in browser settings':'off'}. They fire while the app is open or running in the background on your phone.</p><label for="lead">Remind me before a task starts</label><select id="lead">${[0,5,10,15,30].map(m=>`<option value="${m}" ${st.lead==m?'selected':''}>${m===0?'At start time':m+' minutes'}</option>`).join('')}</select><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" data-act="notif">${st.notify?'Turn off reminders':'Turn on reminders'}</button><button class="btn alt" data-act="ntest">Send a test</button></div></div>
<div class="card"><b>Your data</b><p class="mut" style="margin:6px 0">Everything is stored only on this phone. Export a backup now and then.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn alt" data-act="exp">Export backup</button><label class="btn alt" style="cursor:pointer">Import backup<input id="imp" type="file" accept="application/json" hidden></label><button class="btn dng" data-act="reset">Reset everything</button></div></div>`}
const V={today:vToday,tasks:vTasks,growth:vGrowth,remember:vRemember};
function render(){if(!V[view])view='today';$('#app').innerHTML=V[view]();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view))}
addEventListener('hashchange',()=>{view=(location.hash||'#today').slice(1);edit=null;hed=false;render();scrollTo(0,0)});
async function notify(title,body,tag){toast(title+' – '+body);if(!('Notification'in window)||Notification.permission!=='granted')return;
try{const r=await navigator.serviceWorker.getRegistration();if(r)return r.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200]});new Notification(title,{body,icon:'icon-192.png'})}catch(e){}}
function tick(){if(!S.settings.notify)return;const m=nowMin(),today=dk();
Object.keys(S.fired).forEach(k=>{if(!k.startsWith(today))delete S.fired[k]});
todays().forEach(t=>{const a=toMin(t.time),k=today+t.id;if(m>=a-S.settings.lead&&m<=a+10&&!S.fired[k]&&!isDone(t.id)){S.fired[k]=1;save();notify(S.settings.lead&&m<a?'Starting soon: '+t.title:'Now: '+t.title,t.time+'–'+t.end,k)}});
if(view==='today'&&!document.activeElement.matches('input,textarea,select'))render()}
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
let dayDraft=null;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='toggle'){const s=doneSet(dk()),i=s.indexOf(id);i<0?s.push(id):s.splice(i,1);save();render()}
else if(a==='hedit'){hed=true;render();const x=$('#hx');if(x)x.focus()}
else if(a==='hcancel'){hed=false;render()}
else if(a==='hreset'){S.settings.headline='';hed=false;save();render();toast('Greeting restored')}
else if(a==='day'){b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'))}
else if(a==='edit'){edit=id;render();scrollTo(0,0)}
else if(a==='cancel'){edit=null;render()}
else if(a==='del'){const t=S.tasks.find(x=>x.id===id);if(t&&confirm('Delete "'+t.title+'"?')){S.tasks=S.tasks.filter(x=>x.id!==id);if(edit===id)edit=null;save();render();toast('Task deleted')}}
else if(a==='notif'){if(S.settings.notify){S.settings.notify=false;save();render();toast('Reminders off');return}
if(!('Notification'in window)){toast('This browser does not support notifications.',1);return}
const p=await Notification.requestPermission();if(p==='granted'){S.settings.notify=true;save();render();toast('Reminders on')}else toast('Permission was not granted. Allow notifications in browser settings.',1)}
else if(a==='ntest'){if(!('Notification'in window)||Notification.permission!=='granted'){toast('Turn on reminders first.',1);return}notify('Mohamed','Test reminder works.','test')}
else if(a==='ndel'){if(confirm('Delete this note?')){S.notes=S.notes.filter(x=>x.id!==id);save();render();toast('Note deleted')}}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='routine-backup-'+dk()+'.json';l.click();URL.revokeObjectURL(u);toast('Backup downloaded')}
else if(a==='reset'){if(confirm('Delete ALL tasks, notes and progress? This cannot be undone.')){localStorage.removeItem(KEY);S=seed();save();render();toast('Reset done')}}});
document.addEventListener('input',e=>{const i=e.target.id;
if(i==='fq'){fq.q=e.target.value;$('#tl').innerHTML=taskList()}
else if(i==='nq'){fq.nq=e.target.value;$('#nl').innerHTML=noteList()}});
document.addEventListener('change',e=>{const i=e.target.id;
if(i==='fd'){fq.day=e.target.value;$('#tl').innerHTML=taskList()}
else if(i==='ny'){fq.type=e.target.value;$('#nl').innerHTML=noteList()}
else if(i==='lead'){S.settings.lead=+e.target.value;save();toast('Saved')}
else if(i==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.tasks))throw 0;S=Object.assign(seed(),v);save();render();toast('Backup imported')}catch(x){toast('That file is not a valid Routine backup.',1)}};r.readAsText(f)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.id;
if(f==='tf'){const title=$('#ti').value.trim(),a=$('#ts').value,b=$('#te').value,days=[...document.querySelectorAll('#td .on')].map(x=>+x.dataset.d);
if(!title)return toast('Enter a task title.',1);if(!a||!b)return toast('Set a start and end time.',1);if(toMin(b)<=toMin(a))return toast('End time must be after start time.',1);if(!days.length)return toast('Pick at least one day.',1);
const o={title,time:a,end:b,cat:$('#tc').value,days};if(edit){Object.assign(S.tasks.find(x=>x.id===edit),o);edit=null;toast('Task updated')}else{S.tasks.push({id:uid(),...o});toast('Task added')}save();render()}
else if(f==='nf'){const text=$('#nx').value.trim();if(!text)return toast('Write something to remember.',1);S.notes.push({id:uid(),type:$('#nt').value,src:$('#nb').value.trim(),text,task:$('#nk').value,date:dk()});save();render();toast('Note saved')}
else if(f==='hf'){S.settings.headline=$('#hx').value.trim();hed=false;save();render();toast('Headline saved')}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();tick();
</script>
</body>
</html>
